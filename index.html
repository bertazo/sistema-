<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bertazo | Gestão Estratégica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💼</text></svg>">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root { --bordo: #800020; --gold: #b8860b; --bg: #f8f9fa; --card: #ffffff; --text: #2d3436; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; outline: none; }
        body { background: var(--bg); color: var(--text); margin: 0; }
        .hidden { display: none !important; }
        
        /* LOGIN */
        #auth-screen { position: fixed; inset: 0; background: var(--bordo); display: flex; justify-content: center; align-items: center; z-index: 10000; }
        .login-card { background: white; padding: 40px; border-radius: 20px; width: 350px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        
        /* NAV & HEADER */
        header { background: var(--bordo); color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--gold); position: sticky; top: 0; z-index: 900; }
        nav { background: white; display: flex; justify-content: center; border-bottom: 1px solid #ddd; position: sticky; top: 64px; z-index: 899; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        nav button { background: none; border: none; padding: 18px 25px; cursor: pointer; font-weight: 600; color: #636e72; font-size: 13px; text-transform: uppercase; transition: 0.3s; }
        nav button.active { color: var(--bordo); border-bottom: 3px solid var(--bordo); background: #fff5f7; }
        
        /* LAYOUT */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 30px; }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 4px solid var(--bordo); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        
        /* INPUTS & BUTTONS */
        label { display: block; font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 14px; transition: 0.2s; }
        input:focus, select:focus { border-color: var(--bordo); }
        .btn { background: var(--bordo); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn:hover { background: #5a0016; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(128,0,32,0.2); }
        .btn-alt { background: #636e72; margin-top: 5px; }
        
        /* BI WIDGETS */
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .kpi-card { background: white; padding: 20px; border-radius: 12px; border-bottom: 4px solid var(--gold); text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        .kpi-val { font-size: 28px; font-weight: 800; color: var(--bordo); margin-top: 5px; }
        
        /* TABELAS E FILTROS */
        .filter-bar { background: #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; gap: 10px; align-items: flex-end; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 12px; background: #f9f9f9; color: #888; font-size: 11px; text-transform: uppercase; font-weight: 700; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #fdfdfd; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        
        /* EXPORTAÇÃO */
        .export-actions { display: flex; gap: 10px; margin-bottom: 15px; justify-content: flex-end; }
        .btn-export { width: auto; padding: 8px 15px; font-size: 12px; background: #2d3436; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .btn-pdf { background: #c0392b; }
        .btn-excel { background: #27ae60; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="login-card">
        <h1 style="color:var(--bordo); letter-spacing:3px; margin:0;">BERTAZO</h1>
        <p style="color:#666; margin-bottom:30px; font-size:12px; letter-spacing:1px;">GESTÃO ESTRATÉGICA</p>
        <form onsubmit="event.preventDefault(); handleLogin();">
            <input type="email" id="email" placeholder="E-mail" style="margin-bottom:15px" required>
            <input type="password" id="pass" placeholder="Senha" style="margin-bottom:20px" required>
            <button type="submit" class="btn">ENTRAR NO SISTEMA</button>
        </form>
        <div id="login-err" style="color:red; font-size:12px; margin-top:15px"></div>
    </div>
</div>

<div id="app" class="hidden">
    <header>
        <div style="font-weight: 800; letter-spacing: 2px; font-size: 20px;">BERTAZO</div>
        <button onclick="logout()" style="background:transparent; border:1px solid rgba(255,255,255,0.5); color:white; border-radius:6px; cursor:pointer; padding:6px 15px; font-size:12px; font-weight:600;">SAIR</button>
    </header>

    <nav>
        <button id="n-bi" class="active" onclick="tab('bi')">Dashboard BI</button>
        <button id="n-cli" onclick="tab('cli')">Clientes</button>
        <button id="n-fat" onclick="tab('fat')">Faturamento</button>
        <button id="n-lic" onclick="tab('lic')">Licitações</button>
    </nav>

    <div class="container">
        
        <section id="s-bi">
            <div class="export-actions">
                <button class="btn-export btn-pdf" onclick="exportBIPDF()">📄 Baixar Relatório PDF</button>
            </div>
            
            <div class="kpi-row">
                <div class="kpi-card">
                    <label>Faturamento Total (Mês)</label>
                    <div id="kpi-fat" class="kpi-val">R$ 0,00</div>
                </div>
                <div class="kpi-card">
                    <label>Filtros de Visão</label>
                    <div style="display:flex; gap:10px; margin-top:5px; align-items:center;">
                        <input type="month" id="f-mes" onchange="loadBI()" style="margin:0; text-align:center; font-weight:bold; color:var(--bordo);">
                        <select id="f-rep" onchange="loadBI()" style="margin:0;">
                            <option value="">Todas Representadas</option>
                            <option>PLAXMETAL PR</option><option>PLAXMETAL MS/MT</option>
                            <option>LUNASA</option><option>GEBB</option><option>ARIAM</option><option>ADVENTISTA</option>
                        </select>
                    </div>
                </div>
            </div>
        

            <div class="card">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                    <label>Evolução Diária de Vendas</label>
                </div>
                <canvas id="mainChart" height="90"></canvas>
            </div>
        </section>

        <section id="s-cli" class="hidden">
            <div class="card">
                <h3 id="cli-form-title" style="margin-top:0; color:var(--bordo);">Novo Cliente</h3>
                <input type="hidden" id="c-id">
                <div class="grid">
                    <div><label>Razão Social</label><input type="text" id="c-nome"></div>
                    <div><label>CNPJ</label><input type="text" id="c-cnpj"></div>
                    <div><label>Representada</label>
                        <select id="c-rep">
                            <option>PLAXMETAL PR</option><option>PLAXMETAL MS/MT</option><option>LUNASA</option><option>GEBB</option><option>ARIAM</option><option>ADVENTISTA</option>
                        </select>
                    </div>
                </div>
                <div class="grid">
                    <div><label>WhatsApp</label><input type="text" id="c-whats"></div>
                    <div><label>Contato</label><input type="text" id="c-contato"></div>
                    <div><label>Cidade / Estado</label><input type="text" id="c-end"></div>
                </div>
                <label>Observações</label><textarea id="c-obs" rows="2"></textarea>
                
                <div style="display:flex; gap:10px; margin-top:15px">
                    <button class="btn" id="btn-save-cli" onclick="saveCli()">Salvar Ficha</button>
                    <button class="btn btn-alt hidden" id="btn-cancel-cli" onclick="resetCliForm()">Cancelar Edição</button>
                </div>
            </div>
            
            <div class="export-actions">
                <button class="btn-export btn-excel" onclick="exportExcel('Clientes', filteredCli)">📊 Excel</button>
            </div>

           <div class="filter-bar">
    <div style="flex:2">
        <label>Buscar na Carteira</label>
        <input type="text" id="f-cli-search" placeholder="Digite Nome, CNPJ ou Cidade..." oninput="loadCli()" style="margin:0;">
    </div>
    <div style="flex:1">
        <label>Filtrar por Representada</label>
        <select id="f-cli-rep" onchange="loadCli()" style="margin:0;">
            <option value="">Todas</option>
            <option>PLAXMETAL PR</option>
            <option>PLAXMETAL MS/MT</option>
            <option>LUNASA</option>
            <option>GEBB</option>
            <option>ARIAM</option>
            <option>ADVENTISTA</option>
        </select>
    </div>
</div>
            <div class="card">
                <div class="export-actions">
                    <button class="btn-export btn-excel" onclick="exportExcel('Faturamento', filteredVendas)">📊 Excel</button>
                </div>
                <div class="filter-bar">
                    <div style="flex:1"><label>Filtrar Histórico</label><input type="text" id="f-fat-search" placeholder="Buscar por Cliente ou NF..." oninput="loadVendas()" style="margin:0;"></div>
                </div>
                <div style="overflow-x:auto;">
                    <table id="t-vendas"><thead><tr><th>Data</th><th>Cliente</th><th>Valor</th><th>Rep.</th><th>NF</th><th>Ações</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
        </section>

        <section id="s-lic" class="hidden">
            <div class="card">
                <h3 style="margin-top:0; color:var(--bordo);">Controle de Licitações</h3>
                <div class="grid">
                    <div><label>Data</label><input type="date" id="l-data"></div>
                    <div><label>Órgão / Cliente</label><input type="text" id="l-cli"></div>
                    <div><label>Objeto / Descrição</label><input type="text" id="l-obj"></div>
                </div>
                <div class="grid">
                    <div><label>Valor Total (R$)</label><input type="number" id="l-val" step="0.01"></div>
                    <div><label>Status</label>
                        <select id="l-status">
                            <option>Pendente</option><option>Vencida</option><option>Faturada</option><option>Perdida</option>
                        </select>
                    </div>
                    <div><label>Representada</label>
                        <select id="l-rep">
                            <option>PLAXMETAL PR</option><option>PLAXMETAL MS/MT</option><option>LUNASA</option><option>GEBB</option><option>ARIAM</option><option>ADVENTISTA</option>
                        </select>
                    </div>
                </div>
                <button class="btn" onclick="saveLic()">Salvar Processo</button>
            </div>

            <div class="card">
                <div class="export-actions">
                    <button class="btn-export btn-excel" onclick="exportExcel('Licitacoes', filteredLic)">📊 Excel</button>
                </div>
                <div class="filter-bar">
                    <div style="flex:1"><label>Buscar Processo</label><input type="text" id="f-lic-search" placeholder="Objeto, Cliente ou Status..." oninput="loadLic()" style="margin:0;"></div>
                </div>
                <div style="overflow-x:auto;">
                    <table id="t-lic"><thead><tr><th>Data</th><th>Objeto</th><th>Cliente</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead><tbody></tbody></table>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
    // --- CONFIGURAÇÃO ---
    const SB_URL = "https://abjqrorlzkmbtiqoooxb.supabase.co";
    const SB_KEY = "sb_publishable_89VYMYncTckOQdDyiKXpuQ_AewcuCE4";
    const sb = supabase.createClient(SB_URL, SB_KEY);
    
    let chartInstance = null;
    let rawClientes=[], rawVendas=[], rawLic=[];
    let filteredCli=[], filteredVendas=[], filteredLic=[];

    // --- AUTH ---
    async function handleLogin() {
        const { error } = await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('pass').value });
        if(error) document.getElementById('login-err').innerText = "Erro: Verifique suas credenciais.";
    }
    
    sb.auth.onAuthStateChange((event, session) => {
        if(session) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            init();
        } else {
            document.getElementById('auth-screen').classList.remove('hidden');
            document.getElementById('app').classList.add('hidden');
        }
    });

    async function logout() { await sb.auth.signOut(); }

    function init() {
        document.getElementById('f-mes').value = new Date().toISOString().slice(0, 7);
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById('v-data').value = today;
        document.getElementById('l-data').value = today;
        loadBI(); loadCli(); loadVendas(); loadLic();
    }

    function tab(t) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.getElementById('s-'+t).classList.remove('hidden');
        document.getElementById('n-'+t).classList.add('active');
        if(t === 'bi') loadBI(); // Recarrega BI ao entrar na aba
    }

    // --- CLIENTES ---
    async function saveCli() {
        const id = document.getElementById('c-id').value;
        const payload = {
            nome: document.getElementById('c-nome').value, cnpj: document.getElementById('c-cnpj').value, 
            representada: document.getElementById('c-rep').value, whatsapp: document.getElementById('c-whats').value, 
            contato: document.getElementById('c-contato').value, endereco: document.getElementById('c-end').value, 
            observacoes: document.getElementById('c-obs').value
        };

        if(!payload.nome) return alert("Nome Obrigatório");

        if(id) await sb.from('clientes').update(payload).eq('id', id);
        else await sb.from('clientes').insert([payload]);
        
        alert("Salvo com sucesso!");
        resetCliForm();
        loadCli();
    }

    function editCli(id) {
        const c = rawClientes.find(item => item.id == id);
        document.getElementById('c-id').value = c.id;
        document.getElementById('c-nome').value = c.nome;
        document.getElementById('c-cnpj').value = c.cnpj;
        document.getElementById('c-rep').value = c.representada;
        document.getElementById('c-whats').value = c.whatsapp;
        document.getElementById('c-contato').value = c.contato;
        document.getElementById('c-end').value = c.endereco;
        document.getElementById('c-obs').value = c.observacoes;
        
        document.getElementById('cli-form-title').innerText = "Editando: " + c.nome;
        document.getElementById('btn-save-cli').innerText = "ATUALIZAR REGISTRO";
        document.getElementById('btn-save-cli').classList.add('btn-gold'); // Visual diferente
        document.getElementById('btn-cancel-cli').classList.remove('hidden');
        window.scrollTo({top:0, behavior:'smooth'});
    }

    function resetCliForm() {
        document.getElementById('c-id').value = "";
        document.querySelectorAll('#s-cli input, #s-cli textarea').forEach(i => i.value = "");
        document.getElementById('cli-form-title').innerText = "Novo Cliente";
        document.getElementById('btn-save-cli').innerText = "SALVAR FICHA";
        document.getElementById('btn-save-cli').classList.remove('btn-gold');
        document.getElementById('btn-cancel-cli').classList.add('hidden');
    }

   async function loadCli() {
    const { data } = await sb.from('clientes').select('*').order('nome');
    rawClientes = data || [];
    
    const term = document.getElementById('f-cli-search').value.toLowerCase();
    const repFilter = document.getElementById('f-cli-rep').value;
    
    filteredCli = rawClientes.filter(c => {
        // Verifica se o termo de busca bate com Nome, Endereço ou CNPJ
        const matchText = (c.nome && c.nome.toLowerCase().includes(term)) || 
                          (c.endereco && c.endereco.toLowerCase().includes(term)) ||
                          (c.cnpj && c.cnpj.includes(term));
        
        // Verifica se a representada bate (ou se o filtro está em "Todas")
        const matchRep = repFilter === "" || c.representada === repFilter;
        
        return matchText && matchRep;
    });

    document.getElementById('cli-list').innerHTML = filteredCli.map(c => `
        <div class="card" style="border-left:5px solid var(--gold); border-top:none; padding:15px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <div>
                    <strong style="color:var(--bordo); font-size:16px;">${c.nome}</strong>
                    <div style="font-size:12px; color:#666; margin-top:4px;">
                        <span class="badge" style="background:#eee;">${c.representada}</span> 
                        ${c.endereco ? `| 📍 ${c.endereco}` : ''}
                    </div>
                </div>
                <div>
                    <button onclick="editCli('${c.id}')" style="border:none; background:none; cursor:pointer; color:var(--gold); font-size:16px;">✏️</button>
                    <button onclick="del('clientes','${c.id}', loadCli)" style="border:none; background:none; cursor:pointer; color:red; font-size:16px;">✕</button>
                </div>
            </div>
            <div style="margin-top:8px; font-size:13px; display:flex; gap:15px; flex-wrap:wrap;">
                <span>📞 ${c.whatsapp || '-'}</span>
                <span>👤 ${c.contato || '-'}</span>
                <span>📄 ${c.cnpj || '-'}</span>
            </div>
        </div>`).join('');
}
    // --- VENDAS ---
    async function saveVenda() {
        const val = document.getElementById('v-val').value;
        const cli = document.getElementById('v-cli').value;
        
        if(!val || !cli) return alert("Preencha Valor e Cliente!");

        await sb.from('vendas').insert([{
            data_venda: document.getElementById('v-data').value, 
            cliente_nome: cli,
            valor: parseFloat(val), 
            representada: document.getElementById('v-rep').value, 
            nf: document.getElementById('v-nf').value
        }]);

        // Atualiza BI Imediatamente
        document.getElementById('f-mes').value = document.getElementById('v-data').value.slice(0, 7);
        alert("Venda Registrada!");
        
        // Limpa campos
        document.getElementById('v-val').value = "";
        document.getElementById('v-cli').value = "";
        document.getElementById('v-nf').value = "";
        
        loadVendas(); loadBI();
    }

    async function loadVendas() {
        const { data } = await sb.from('vendas').select('*').order('data_venda', {ascending:false}).limit(100);
        rawVendas = data || [];
        const term = document.getElementById('f-fat-search').value.toLowerCase();
        
        filteredVendas = rawVendas.filter(v => 
            v.cliente_nome.toLowerCase().includes(term) || (v.nf && v.nf.includes(term))
        );

        document.querySelector('#t-vendas tbody').innerHTML = filteredVendas.map(v => `
            <tr>
                <td>${v.data_venda.split('-').reverse().join('/')}</td>
                <td>${v.cliente_nome}</td>
                <td style="color:var(--bordo); font-weight:bold;">R$ ${v.valor.toLocaleString('pt-BR')}</td>
                <td><span class="badge" style="background:#f1f1f1">${v.representada}</span></td>
                <td>${v.nf || '-'}</td>
                <td><button onclick="del('vendas','${v.id}', ()=>{loadVendas();loadBI()})" style="color:red; border:none; background:none; cursor:pointer;">✕</button></td>
            </tr>`).join('');
    }

    // --- LICITAÇÕES ---
    async function saveLic() {
        await sb.from('licitacoes').insert([{
            data_pedido: document.getElementById('l-data').value,
            objeto: document.getElementById('l-obj').value, 
            cliente: document.getElementById('l-cli').value,
            valor_total: parseFloat(document.getElementById('l-val').value), 
            status: document.getElementById('l-status').value,
            representada: document.getElementById('l-rep').value
        }]);
        loadLic(); alert("Salvo!");
        document.getElementById('l-val').value = "";
        document.getElementById('l-obj').value = "";
    }

    async function loadLic() {
        const { data } = await sb.from('licitacoes').select('*').order('data_pedido', {ascending:false});
        rawLic = data || [];
        const term = document.getElementById('f-lic-search').value.toLowerCase();

        filteredLic = rawLic.filter(l => 
            (l.objeto && l.objeto.toLowerCase().includes(term)) || 
            (l.cliente && l.cliente.toLowerCase().includes(term)) || 
            l.status.toLowerCase().includes(term)
        );

        document.querySelector('#t-lic tbody').innerHTML = filteredLic.map(l => `
            <tr>
                <td>${l.data_pedido ? l.data_pedido.split('-').reverse().join('/') : '-'}</td>
                <td>${l.objeto}</td>
                <td>${l.cliente}</td>
                <td>R$ ${l.valor_total.toLocaleString('pt-BR')}</td>
                <td><span class="badge" style="background:${l.status=='Ganha'?'#27ae60':(l.status=='Perdida'?'#c0392b':'#f39c12')}; color:white;">${l.status}</span></td>
                <td><button onclick="del('licitacoes','${l.id}', loadLic)" style="color:red; border:none; background:none; cursor:pointer;">✕</button></td>
            </tr>`).join('');
    }

    // --- BI (CORRIGIDO) ---
    async function loadBI() {
        const mes = document.getElementById('f-mes').value;
        const rep = document.getElementById('f-rep').value;
        
        // Busca do Banco (Mês Completo)
        let query = sb.from('vendas').select('*')
            .gte('data_venda', `${mes}-01`)
            .lte('data_venda', `${mes}-31`);
            
        if(rep) query = query.eq('representada', rep);

        const { data } = await query;
        if(!data) return;

        // KPI
        const total = data.reduce((a, b) => a + b.valor, 0);
        document.getElementById('kpi-fat').innerText = total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

        // Gráfico
        const dias = {};
        data.forEach(v => { 
            const d = v.data_venda.split('-')[2]; // Pega o dia (01, 05...)
            dias[d] = (dias[d]||0) + v.valor; 
        });
        
        const labels = Object.keys(dias).sort(); // Ordena dias 1, 2, 3...
        const values = labels.map(d => dias[d]);

        const ctx = document.getElementById('mainChart').getContext('2d');
        if(chartInstance) chartInstance.destroy(); // Destrói para não bugar
        
        chartInstance = new Chart(ctx, {
            type:'line', 
            data:{ 
                labels: labels, 
                datasets:[{
                    label:'Vendas (R$)', 
                    data: values, 
                    borderColor:'#800020', 
                    borderWidth: 2,
                    tension:0.3, 
                    fill:true, 
                    backgroundColor:'rgba(128,0,32,0.05)',
                    pointBackgroundColor: '#b8860b'
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: {display:false} },
                scales: { x: { grid: {display:false} } }
            }
        });
    }

    async function del(table, id, callback) { 
        if(confirm("Deseja realmente excluir?")) { 
            await sb.from(table).delete().eq('id', id); 
            callback(); 
        } 
    }

    // --- EXPORTAÇÃO EXCEL ---
    function exportExcel(name, dataJson) {
        if(!dataJson || dataJson.length === 0) return alert("Nada para exportar!");
        const ws = XLSX.utils.json_to_sheet(dataJson);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dados");
        XLSX.writeFile(wb, `Bertazo_${name}.xlsx`);
    }

    // --- EXPORTAÇÃO PDF DO BI ---
    function exportBIPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(18);
        doc.setTextColor(128, 0, 32);
        doc.text("RELATÓRIO DE PERFORMANCE - BERTAZO", 14, 20);
        
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text(`Referência: ${document.getElementById('f-mes').value}`, 14, 30);
        doc.text(`Faturamento Total: ${document.getElementById('kpi-fat').innerText}`, 14, 38);
        
        const canvas = document.getElementById('mainChart');
        const imgData = canvas.toDataURL('image/png');
        doc.addImage(imgData, 'PNG', 14, 50, 180, 90);
        
        doc.save(`Dashboard_Bertazo_${document.getElementById('f-mes').value}.pdf`);
    }
</script>
</body>
</html>
